name: Build release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check that the version matches the tag
        run: |
          VERSION=$(grep -oP 'VERSION\s*=\s*"\K[^"]+' _meta.lua | head -1 || true)
          echo "Tag: $TAG | _meta.lua VERSION: ${VERSION:-<not found>}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find VERSION in _meta.lua."
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::The tag is $TAG but _meta.lua says VERSION = $VERSION. Update _meta.lua, then publish the release again."
            exit 1
          fi

      - name: Build zip
        run: |
          PLUGIN_DIR="KiKomeScrubber.koplugin"
          mkdir -p "/tmp/build/$PLUGIN_DIR"
          rsync -a \
            --exclude='/images/' \
            --exclude='/README.md' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            ./ "/tmp/build/$PLUGIN_DIR/"
          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/KiKomeScrubber.koplugin.zip" "$PLUGIN_DIR"

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" KiKomeScrubber.koplugin.zip --clobber

      - name: Add installation instructions to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q "^## Installation" notes.md; then
            cat >> notes.md <<'NOTES'

          ## Installation
          1. Download `KiKomeScrubber.koplugin.zip` from the **Assets** section below (not "Source code").
          2. Unzip it and copy the `KiKomeScrubber.koplugin` folder into `koreader/plugins/`.
          3. Restart KOReader.

          To update, use **Check for updates** in KiKome's Settings, or replace the folder. To uninstall, delete it.
          NOTES
            gh release edit "$TAG" --notes-file notes.md
          fi
